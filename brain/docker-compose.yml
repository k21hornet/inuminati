services:
  mysql:
    image: mysql:8.0
    container_name: inuminati-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3367:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inuminati-brain
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3367)/${MYSQL_DATABASE}?parseTime=true
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-debug}
      - AUTO_MIGRATE=true
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
